<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="103" fill="none" stroke="#334155" stroke-width="4" opacity="0.4"/>
  
  <!-- Wallet Icon Base -->
  <g transform="translate(96, 120)">
    <!-- Wallet body -->
    <rect x="0" y="40" width="320" height="220" rx="36" fill="#1e293b" stroke="#475569" stroke-width="8"/>
    <!-- Wallet Top Flap / Back -->
    <path d="M 30 40 L 290 40 C 300 40 310 30 300 15 C 290 0 270 0 250 0 L 70 0 C 50 0 30 0 20 15 C 10 30 20 40 30 40 Z" fill="#334155"/>
    
    <!-- Cash Card / Bills peaking out -->
    <rect x="40" y="-15" width="240" height="50" rx="12" fill="url(#emeraldGrad)"/>
    <circle cx="160" cy="10" r="14" fill="#065f46" opacity="0.6"/>
    
    <!-- Wallet Flap & Clasp -->
    <path d="M 180 110 L 320 110 C 330 110 330 190 320 190 L 180 190 C 160 190 150 170 150 150 C 150 130 160 110 180 110 Z" fill="#0f172a" stroke="#475569" stroke-width="6"/>
    <circle cx="200" cy="150" r="16" fill="url(#goldGrad)"/>
    <circle cx="200" cy="150" r="8" fill="#78350f"/>
    
    <!-- Growth Arrow badge -->
    <g transform="translate(20, 150)">
      <circle cx="24" cy="24" r="32" fill="#059669"/>
      <path d="M 14 26 L 24 16 L 34 26 M 24 16 L 24 34" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
